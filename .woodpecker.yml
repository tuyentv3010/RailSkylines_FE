when:
  - event: tag        # chỉ build khi push TAG (giống BE)

steps:
  build-push:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: tuyentvwork/railskylines-fe
      # FE nhúng NEXT_PUBLIC_* lúc `next build` từ .env.production (đã commit trong repo).
      tags:
        - ${CI_COMMIT_TAG}    # image tag = tên git tag
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  # GitOps CD: bump the image tag in deploy/compose.yaml to this release tag,
  # then commit & push to the branch Komodo watches. Komodo redeploys on the git
  # change; the changed tag makes compose recreate the container (no --force needed).
  bump-deploy:
    image: alpine/git
    environment:
      GIT_TOKEN:
        from_secret: git_token
    commands:
      - git config --global user.email "ci@railskylines.local"
      - git config --global user.name "woodpecker-ci"
      - git fetch origin TuyenTV_Deploy
      - git checkout -B TuyenTV_Deploy origin/TuyenTV_Deploy
      - sed -i "s|railskylines-fe:.*|railskylines-fe:${CI_COMMIT_TAG}|" deploy/compose.yaml
      - git add deploy/compose.yaml
      - git commit -m "deploy(fe) ${CI_COMMIT_TAG}" || echo "nothing to commit"
      - git push https://$${GIT_TOKEN}@github.com/tuyentv3010/RailSkylines_FE.git HEAD:TuyenTV_Deploy
