when:
  - event: tag        # chỉ build khi push TAG (giống BE)

steps:
  build-push:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: tuyentvwork/railskylines-fe
      # FE nhúng NEXT_PUBLIC_* lúc `next build` từ .env.production (đã commit trong repo).
      tags:
        - ${CI_COMMIT_TAG}    # image tag = tên git tag
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  # CD: SSH vao VPS, keo image moi + dung lai container (force-recreate cho chac).
  # Chay sau khi build-push thanh cong.
  deploy:
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: ssh_host
      username:
        from_secret: ssh_user
      key:
        from_secret: ssh_key
      port: 22
      command_timeout: 10m
      script:
        - cd /etc/komodo/stacks/railskylines-fe && docker compose pull && docker compose up -d --force-recreate
